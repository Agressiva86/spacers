<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Spacers">
  <title>Spacers</title>
  <defs>
    <style>
      .mark { fill: #242D34; }
      @media (prefers-color-scheme: dark) {
        .mark { fill: #D0DAE1; }
      }
    </style>
    <mask id="sygnet" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <image href="data:image/png;base64," width="32" height="32" preserveAspectRatio="xMidYMid meet"/>
    </mask>
  </defs>
  <rect class="mark" width="32" height="32" mask="url(#sygnet)"/>
</svg>